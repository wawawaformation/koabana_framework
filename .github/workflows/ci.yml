name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # On veut le résultat des deux versions, même si l'une échoue
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      APP_ENV: test
      APP_DEBUG: "0"
      DB_DSN: "sqlite::memory:"
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - name: Prepare writable dirs
        run: mkdir -p var/log

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: PHPUnit + seuil de couverture
        run: composer test:coverage

      # CS-Fixer ne supporte pas encore officiellement PHP 8.5 : style vérifié une seule fois
      - name: CS-Fixer
        if: matrix.php == '8.4'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
